<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>应急供氧歧管接头复原</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%9D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>深海载人舱 · 应急供氧歧管复原</h1>
    <p class="subtitle">更换可拆模块后，本地联合选择全部接头方案：共享边严格“出气 → 进气”，全部登记气源送达指定用气端，全网只允许无环供气流路。</p>
  </header>

  <main>
    <section class="panel" id="editor-panel">
      <div class="panel-head">
        <h2>① 模块格网与候选接头</h2>
        <div class="size-controls">
          <label>行数
            <select id="rows-select"><option value="2">2</option><option value="3">3</option></select>
          </label>
          <label>列数
            <select id="cols-select">
              <option value="2">2</option><option value="3">3</option><option value="4">4</option>
            </select>
          </label>
          <button type="button" id="load-example" class="btn ghost">载入示例</button>
          <button type="button" id="clear-draft" class="btn ghost">清空草稿</button>
        </div>
      </div>

      <div class="layout">
        <div class="left-col">
          <div id="grid-mount" class="grid-mount"></div>
          <div id="cells-editor-mount" class="cells-editor"></div>
        </div>

        <div class="side">
          <h3>② 格网外边登记气源 / 用气端</h3>
          <div id="terminal-list" class="terminal-list"></div>
          <div class="terminal-add">
            <button type="button" id="add-source" class="btn">＋ 登记气源端</button>
            <button type="button" id="add-sink" class="btn">＋ 登记用气端</button>
          </div>
          <p class="hint">端子只能登记在格网外缘；同一条外缘边至多一个端子。气源由外部注入，故气源侧必须是接头的<strong>进气边</strong>；用气侧必须是<strong>出气边</strong>。</p>

          <div class="actions">
            <button type="button" id="restore-btn" class="btn primary big">复 原</button>
            <span id="local-note" class="hint">全部计算仅在本浏览器内完成，不上传任何数据。</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" id="result-panel" hidden>
      <div class="panel-head"><h2>③ 复原结果</h2></div>
      <div id="result-body"></div>
    </section>
  </main>

  <footer>
    <span>应急供氧歧管接头复原工具 · 纯本地静态应用</span>
  </footer>

  <script type="module" src="/src/app.mjs"></script>
</body>
</html>
