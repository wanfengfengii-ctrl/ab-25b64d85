server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器/编排健康检查端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # 单页应用：静态资源回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
